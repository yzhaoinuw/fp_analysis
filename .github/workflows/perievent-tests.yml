name: Perievent Tests

on:
  push:
    branches:
      - codex/workflow
      - dev
  pull_request:

jobs:
  perievent-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.25.2 \
            pandas==2.1.3 \
            scipy==1.12.0 \
            openpyxl==3.1.5 \
            XlsxWriter==3.2.0 \
            matplotlib==3.10.7 \
            plotly==5.23.0 \
            plotly-resampler==0.11.0 \
            "dash[diskcache]==2.17.1" \
            dash-extensions==1.0.18 \
            pywebview==6.1 \
            "desktop-app-source-updater @ git+https://github.com/yzhaoinuw/desktop_app_source_updater.git@85bb68e42155ad8b661f669df8d281fbe683a045"

      - name: Run focused unittest suites
        run: python -m unittest tests.test_perievent_analysis tests.test_startup_update tests.test_packaging
